<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face B</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main>
        <div class="navbar">
            <div class="navbar-left">
                <h1 class="navbar-title">Face B.</h1>
            </div>
            <div class="navbar-rigth">
                <div class="navbar-rigth-accueil">
                    <a class="nav-link" href="#">Accueil</a>
                </div>
                <div class="navbar-rigth-programme">
                    <a class="nav-link" href="#">Programme</a>
                </div>
            </div>
        </div>
        <div class="section-principale">
            <div class="section-principale-left">
                <div class="section-principale-left-content">
                    <div class="section-principale-left-first">
                        <p>SAMEDI 19 JUIN 2027 · PARIS</p>
                    </div>
                     <div class="section-principale-left-second">
                         <h1>Monte le volume.</h1>
                     </div>
                     <div class="section-principale-left-third">
                         <p>Rap, R&B et électro. Trois concerts pour découvrir
                         des artistes à suivre de près.</p>
                     </div>
                     <div class="section-principale-left-fourth">
                         <button class="button"> Voir le programme</button>
                         <a href="#">Infos pratiques</a>
                     </div>
                </div>
            </div>
            <div class="section-principale-rigth">
                <img class="image-cassette" src="assets/Cassette violette.png" alt="Photo de cassette vintage" />
            </div>
        </div>
    </main>
</body>
</html>
